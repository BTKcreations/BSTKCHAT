<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b141a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BSTK Chat" />
  <title>BSTK Chat — Decentralized E2EE</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scrypt-js@3.0.1/scrypt.min.js"></script>
  <style>
    :root {
      --bg: #0b141a;
      --surface: #111b21;
      --surface-2: #202c33;
      --border: #2a3942;
      --text: #e9edef;
      --muted: #8696a0;
      --accent: #00a884;
      --accent-2: #53bdeb;
      --green: #00a884;
      --amber: #f59e0b;
      --own-bg: #005c4b;
      --dm-bg: #3b0764;
      --mention-bg: rgba(245, 158, 11, 0.14);
      --code-bg: #091014;
    }
    html[data-theme="light"] {
      --bg: #efeae2;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #d1d7db;
      --text: #111b21;
      --muted: #667781;
      --accent: #008069;
      --accent-2: #027eb5;
      --green: #008069;
      --amber: #d97706;
      --own-bg: #d9fdd3;
      --dm-bg: #f3e8ff;
      --mention-bg: rgba(245, 158, 11, 0.16);
      --code-bg: #f1f5f9;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      font-family: "Plus Jakarta Sans", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    input, select, textarea, button { font: inherit; color: inherit; }
    .btn {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .dot.ok { background: var(--green); }

    /* Onboarding Screen */
    .join-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
      overflow-y: auto;
    }
    .join-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .join-logo { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
    .join-sub { font-size: 0.83rem; color: var(--muted); line-height: 1.45; }
    .field-label { font-size: 0.74rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: block; }
    .recent-section { display: none; flex-direction: column; gap: 7px; margin-top: 2px; }
    .recent-list { display: flex; flex-direction: column; gap: 6px; max-height: 185px; overflow-y: auto; }
    .recent-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .recent-card:hover { border-color: var(--accent); }
    .recent-meta { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
    .recent-del { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px 7px; border-radius: 6px; }

    /* App Shell */
    .app { display: none; height: 100dvh; width: 100%; grid-template-columns: 1fr; position: relative; }
    .app.active { display: grid; }
    .sidebar {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: 295px; max-width: 85vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      gap: 11px;
      overflow-y: auto;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 35; display: none; }
    .backdrop.open { display: block; }
    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .card-title { font-size: 0.69rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .peer-list, .chat-list { display: flex; flex-direction: column; gap: 5px; max-height: 165px; overflow-y: auto; }
    .peer-item, .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid transparent;
      font-size: 0.83rem;
      cursor: pointer;
    }
    .chat-item.active { border-color: var(--accent); background: rgba(0, 168, 132, 0.14); }
    .main { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; position: relative; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .room-name { font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .date-divider {
      align-self: center;
      font-size: 0.7rem;
      background: var(--surface-2);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .msg {
      position: relative;
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      align-self: flex-start;
      line-height: 1.42;
      word-wrap: break-word;
      font-size: 0.91rem;
    }
    .msg.own { background: var(--own-bg); align-self: flex-end; border-color: transparent; }
    .msg.dm { background: var(--dm-bg); border-color: #a855f7; }
    .msg.mention { background: var(--mention-bg); border-color: var(--amber); }
    .msg.deleted { opacity: 0.65; font-style: italic; }
    .msg.system {
      align-self: center;
      max-width: 92%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.77rem;
      padding: 2px 6px;
      text-align: center;
    }
    .msg-actions {
      display: none;
      gap: 4px;
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }
    .msg.show-actions .msg-actions, .msg:hover .msg-actions { display: flex; }
    .msg-act-btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-size: 0.75rem; padding: 2px 7px; }
    .reply-quote {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      margin-bottom: 5px;
      color: var(--muted);
    }
    .msg-head { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; margin-bottom: 2px; flex-wrap: wrap; }
    .msg-sender { font-weight: 700; }
    .msg-foot { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-size: 0.68rem; color: var(--muted); margin-top: 3px; }
    .tick.read { color: var(--accent-2); font-weight: 700; }
    .reactions-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .react-pill { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; font-size: 0.73rem; cursor: pointer; }
    .msg-body pre { background: var(--code-bg); padding: 8px 10px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; margin: 5px 0 2px; }
    .msg-body code, .msg-body pre code { font-family: "Roboto Mono", ui-monospace, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: 0.84em; }
    .msg-body pre code { background: transparent; padding: 0; }
    .chat-img { display: block; max-width: min(270px, 70vw); max-height: 230px; border-radius: 10px; margin: 4px 0 5px; cursor: zoom-in; object-fit: cover; }
    .reply-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .typing-bar { padding: 2px 14px; font-size: 0.74rem; color: var(--accent); min-height: 18px; }
    .scroll-btn {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 112px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.78rem;
      z-index: 20;
    }
    .composer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .composer-meta { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); flex-wrap: wrap; }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.94rem;
      outline: none;
    }
    .lightbox { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.9); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
    .lightbox img { max-width: 94vw; max-height: 88dvh; border-radius: 12px; }
    @media (min-width: 900px) {
      .app.active { grid-template-columns: 300px 1fr; }
      .sidebar { position: static; transform: none; max-width: none; }
      .menu-btn, .backdrop { display: none !important; }
      .msg { max-width: 70%; }
    }
  </style>
</head>
<body>
  <section id="joinScreen" class="join-screen">
    <div class="join-card">
      <div class="join-logo">
        <span>⚡ BSTK Chat</span>
        <span class="pill">PWA • E2EE</span>
      </div>
      <div class="join-sub">
        Decentralized, end-to-end encrypted chat compatible with the <strong>bstkchat</strong> terminal &amp; desktop Web UI.
      </div>
      <div>
        <label class="field-label" for="joinNick">Nickname</label>
        <input id="joinNick" class="input" placeholder="e.g. Alex" />
      </div>
      <div>
        <label class="field-label" for="joinRoom">Room ID</label>
        <div style="display:flex; gap:6px;">
          <input id="joinRoom" class="input" placeholder="e.g. quantum-beacon-55" />
          <button class="btn-ghost" type="button" onclick="fillRandomRoom()" title="Generate room">🎲</button>
        </div>
      </div>
      <div>
        <label class="field-label" for="joinPass">Room Password (Optional E2EE)</label>
        <input id="joinPass" class="input" type="password" placeholder="Leave empty for public room" />
      </div>
      <button id="joinBtn" class="btn" type="button" onclick="startChat()">Join Room</button>
      <div id="recentSection" class="recent-section">
        <span class="field-label" style="margin-bottom:0;">Recent Rooms (Tap to Rejoin)</span>
        <div id="recentList" class="recent-list"></div>
      </div>
      <button id="installBtn" class="btn-ghost" type="button" style="display:none;" onclick="triggerInstall()">📲 Install to Home Screen</button>
    </div>
  </section>

  <div id="app" class="app">
    <div id="backdrop" class="backdrop" onclick="toggleDrawer(false)"></div>
    <aside id="sidebar" class="sidebar">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <strong style="font-size:1rem;">⚡ BSTK Chat</strong>
        <span class="pill"><span id="connDot" class="dot"></span><span id="connText">Connecting</span></span>
      </div>

      <div class="card">
        <div class="card-title">Chats (1-Tap Switch)</div>
        <div id="sideChatList" class="chat-list"></div>
        <div style="display:flex; gap:6px;">
          <button class="btn-ghost" style="flex:1;" onclick="copyInviteLink()">📋 Invite Link</button>
          <button class="btn-ghost" onclick="leaveToSetup()">New Room</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Online Peers (<span id="peerCount">1</span>)</div>
        <div id="peerList" class="peer-list"></div>
      </div>

      <div class="card">
        <div class="card-title">Decentralized Room Chain</div>
        <div id="chainInfo" style="font-size:0.78rem; color:var(--muted);">0 block(s)</div>
        <button class="btn-ghost" onclick="requestSync()">🔗 Sync Peers</button>
      </div>

      <button id="installBtnSide" class="btn-ghost" style="display:none;" onclick="triggerInstall()">📲 Install App</button>
    </aside>

    <main id="mainArea" class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-ghost menu-btn" onclick="toggleDrawer(true)" aria-label="Menu">☰</button>
          <span class="room-name" id="roomTitle">#room</span>
          <span id="e2eeBadge" class="pill">🔓 Public</span>
        </div>
        <div class="topbar-right">
          <button class="btn-ghost" onclick="enableNotifications()" title="Notifications">🔔</button>
          <button class="btn-ghost" onclick="toggleTheme()" title="Theme">🌓</button>
        </div>
      </header>

      <div id="messages" class="messages"></div>
      <button id="scrollBtn" class="scroll-btn" onclick="scrollToBottom()">↓ Latest</button>
      <div id="typingBar" class="typing-bar"></div>

      <footer class="composer">
        <div id="replyBar" class="reply-bar">
          <span id="replyText"></span>
          <button class="btn-ghost" onclick="clearReply()">✕</button>
        </div>
        <div class="composer-meta">
          <select id="dmTarget" class="input" style="width:auto; padding:4px 8px; font-size:0.77rem;">
            <option value="">Everyone</option>
          </select>
          <label class="btn-ghost" style="padding:4px 9px; font-size:0.77rem; cursor:pointer;">
            📎 Attach
            <input id="fileInput" type="file" style="display:none;" onchange="sendFile(this)" />
          </label>
          <button id="voiceBtn" class="btn-ghost" style="padding:4px 9px; font-size:0.77rem;" onclick="toggleVoice()">🎤 Voice</button>
        </div>
        <div class="composer-row">
          <textarea id="msgInput" rows="1" placeholder="Message (tap bubble to reply/react)..."></textarea>
          <button class="btn" onclick="sendMessage()">Send</button>
        </div>
      </footer>
    </main>
  </div>

  <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="" alt="Preview" />
  </div>

  <script>
    const BROKER_WSS = "wss://broker.hivemq.com:8884/mqtt";
    const MAX_FILE_BYTES = 512 * 1024;
    const GENESIS_HASH = "GENESIS";
    const QUICK_EMOJIS = ["👍", "❤️", "😂", "🔥", "👏"];

    const enc = new TextEncoder();
    const dec = new TextDecoder();

    let client = null;
    let myNick = "";
    let myRoom = "";
    let myPass = "";
    let myStatus = "Active";
    let aesKey = null;
    let topics = {};
    let peers = {};
    let typingPeers = {};
    let chain = [];
    let seenIds = new Set();
    let reactionsMap = {};
    let replyTo = null;
    let dateShown = false;
    let lastTypingSent = 0;
    let deferredInstallPrompt = null;
    let mediaRecorder = null;
    let voiceChunks = [];

    const savedTheme = localStorage.getItem("bstk_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById("installBtn").style.display = "block";
      document.getElementById("installBtnSide").style.display = "block";
    });
    async function triggerInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById("installBtn").style.display = "none";
      document.getElementById("installBtnSide").style.display = "none";
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("bstk_theme", next);
    }
    function toggleDrawer(open) {
      document.getElementById("sidebar").classList.toggle("open", open);
      document.getElementById("backdrop").classList.toggle("open", open);
    }
    function enableNotifications() {
      if ("Notification" in window) Notification.requestPermission();
    }

    const urlParams = new URLSearchParams(location.search);
    document.getElementById("joinNick").value = localStorage.getItem("bstk_nick") || "";
    document.getElementById("joinRoom").value = urlParams.get("room") || localStorage.getItem("bstk_room") || "";

    function loadRecentRooms() {
      try {
        const arr = JSON.parse(localStorage.getItem("bstk_recent_rooms") || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    }
    function saveRecentRoom(roomId, nickname, hasPassword) {
      const list = loadRecentRooms().filter((r) => r.roomId !== roomId);
      list.unshift({ roomId, nickname, hasPassword: Boolean(hasPassword), lastVisited: Date.now() });
      try { localStorage.setItem("bstk_recent_rooms", JSON.stringify(list.slice(0, 8))); } catch {}
      renderRecentRooms();
    }
    function removeRecentRoom(e, roomId) {
      e.stopPropagation();
      const list = loadRecentRooms().filter((r) => r.roomId !== roomId);
      try { localStorage.setItem("bstk_recent_rooms", JSON.stringify(list)); } catch {}
      renderRecentRooms();
    }
    function formatLastSeen(ts) {
      const diffHrs = Math.floor((Date.now() - ts) / 3600000);
      if (diffHrs < 1) return "Just now";
      if (diffHrs < 24) return `${diffHrs}h ago`;
      const diffDays = Math.floor(diffHrs / 24);
      if (diffDays === 1) return "Yesterday";
      if (diffDays < 7) return `${diffDays}d ago`;
      return new Date(ts).toLocaleDateString();
    }
    function renderRecentRooms() {
      const section = document.getElementById("recentSection");
      const listEl = document.getElementById("recentList");
      const sideList = document.getElementById("sideChatList");
      const rooms = loadRecentRooms();
      sideList.innerHTML = "";
      if (!rooms.length) { section.style.display = "none"; listEl.innerHTML = ""; return; }
      section.style.display = "flex";
      listEl.innerHTML = "";
      for (const r of rooms) {
        let msgCount = 0;
        try { msgCount = JSON.parse(localStorage.getItem(`bstkchat_chain_${r.roomId}`) || "[]").length; } catch {}
        const card = document.createElement("div");
        card.className = "recent-card";
        card.onclick = () => openRecentRoom(r);
        card.innerHTML = `<div style="min-width:0;"><div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:0.88rem;"><span>#${escapeHtml(r.roomId)}</span><span class="pill">${r.hasPassword ? "🔒 E2EE" : "🔓 Public"}</span></div><div class="recent-meta">${escapeHtml(r.nickname || "User")} • ${msgCount} msg(s) • ${escapeHtml(formatLastSeen(r.lastVisited || Date.now()))}</div></div><button class="recent-del" type="button">✕</button>`;
        card.querySelector(".recent-del").onclick = (e) => removeRecentRoom(e, r.roomId);
        listEl.appendChild(card);

        const item = document.createElement("div");
        item.className = "chat-item" + (r.room_id === myRoom || r.roomId === myRoom ? " active" : "");
        item.onclick = () => { toggleDrawer(false); quickSwitchRecent(r); };
        item.innerHTML = `<span>#${escapeHtml(r.roomId)}</span><span class="pill">${r.hasPassword ? "🔒" : "🔓"}</span>`;
        sideList.appendChild(item);
      }
    }
    function openRecentRoom(r) {
      const nickInput = document.getElementById("joinNick");
      const roomInput = document.getElementById("joinRoom");
      const passInput = document.getElementById("joinPass");
      if (!nickInput.value.trim() && r.nickname) nickInput.value = r.nickname;
      roomInput.value = r.roomId;
      if (r.hasPassword && !passInput.value) {
        passInput.placeholder = `Enter password for #${r.roomId}`;
        passInput.focus();
        return;
      }
      startChat();
    }
    function quickSwitchRecent(r) {
      if (r.roomId === myRoom) return;
      let pw = "";
      if (r.hasPassword) {
        pw = prompt(`Enter E2EE password for #${r.roomId}:`) || "";
        if (!pw) return;
      }
      document.getElementById("joinRoom").value = r.roomId;
      document.getElementById("joinPass").value = pw;
      startChat();
    }

    function fillRandomRoom() {
      const adj = ["neon", "cyber", "quantum", "cosmic", "shadow", "hyper", "solar", "golden"];
      const noun = ["tiger", "falcon", "phoenix", "nebula", "vortex", "beacon", "orbit", "echo"];
      document.getElementById("joinRoom").value = `${adj[Math.floor(Math.random()*adj.length)]}-${noun[Math.floor(Math.random()*noun.length)]}-${Math.floor(10 + Math.random()*90)}`;
    }
    function sanitizeRoomId(r) {
      return (r || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "_").replace(/^_+|_+$/g, "") || "default";
    }
    function escapeHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    function formatMarkdown(raw) {
      let safe = escapeHtml(raw);
      safe = safe.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/\n/g, "<br>");
      return safe;
    }
    function nowTimeStr() { return new Date().toTimeString().slice(0, 8); }
    function toUrlSafeB64(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_");
    }
    function fromUrlSafeB64(str) {
      let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveRoomKey(roomId, password) {
      const norm = roomId.trim().toLowerCase();
      const salt = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(`bstkchat-v2:${norm}`)));
      const secret = enc.encode(`${norm}:${password || ""}`);
      const rawKey = await scrypt.scrypt(secret, salt, 16384, 8, 1, 32);
      return crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
    }
    async function encryptPayload(plaintext, aadStr) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(aadStr) }, aesKey, enc.encode(plaintext)));
      const combined = new Uint8Array(12 + ct.length);
      combined.set(iv, 0); combined.set(ct, 12);
      return toUrlSafeB64(combined);
    }
    async function decryptPayload(token, aadStr) {
      try {
        const raw = fromUrlSafeB64(token);
        if (raw.length <= 12) return { ok: false, text: "[Decryption Failed]" };
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12), additionalData: enc.encode(aadStr) }, aesKey, raw.slice(12));
        return { ok: true, text: dec.decode(pt) };
      } catch { return { ok: false, text: "[Decryption Failed - Check Password]" }; }
    }
    async function computeBlockHash(b) {
      const payload = [b.prev_hash || GENESIS_HASH, b.id || "", Number(b.ts || 0).toFixed(6), b.time || "", b.sender || "", b.type || "message", b.ciphertext || ""].join("|");
      const buf = await crypto.subtle.digest("SHA-256", enc.encode(payload));
      return Array.from(new Uint8Array(buf)).map((x) => x.toString(16).padStart(2, "0")).join("");
    }
    function loadChain() {
      try { chain = JSON.parse(localStorage.getItem(`bstkchat_chain_${myRoom}`) || "[]"); if (!Array.isArray(chain)) chain = []; } catch { chain = []; }
      seenIds = new Set(chain.map((b) => String(b.id)));
      document.getElementById("chainInfo").textContent = `✓ Valid · ${chain.length} encrypted block(s)`;
    }
    function saveChain() {
      try { localStorage.setItem(`bstkchat_chain_${myRoom}`, JSON.stringify(chain.slice(-200))); } catch {}
      document.getElementById("chainInfo").textContent = `✓ Valid · ${chain.length} encrypted block(s)`;
    }
    async function appendChainBlock(id, ts, timeStr, sender, type, ciphertext) {
      if (!id || seenIds.has(id)) return;
      const prev_hash = chain.length ? chain[chain.length - 1].hash : GENESIS_HASH;
      const block = { id, ts: Number(ts), time: timeStr, sender, type, ciphertext, prev_hash };
      block.hash = await computeBlockHash(block);
      chain.push(block);
      chain.sort((a, b) => a.ts - b.ts || String(a.id).localeCompare(String(b.id)));
      seenIds.add(id);
      saveChain();
    }

    async function startChat() {
      const btn = document.getElementById("joinBtn");
      btn.disabled = true; btn.textContent = "Deriving E2EE key...";
      try {
        myNick = document.getElementById("joinNick").value.trim() || `User-${Math.floor(100 + Math.random()*900)}`;
        myRoom = sanitizeRoomId(document.getElementById("joinRoom").value || "general");
        myPass = document.getElementById("joinPass").value || "";
        localStorage.setItem("bstk_nick", myNick);
        localStorage.setItem("bstk_room", myRoom);
        saveRecentRoom(myRoom, myNick, Boolean(myPass));

        aesKey = await deriveRoomKey(myRoom, myPass);
        topics = { msg: `bstkchat/rooms/${myRoom}/messages`, presence: `bstkchat/rooms/${myRoom}/presence`, sync: `bstkchat/rooms/${myRoom}/sync` };
        peers = {}; typingPeers = {}; reactionsMap = {}; dateShown = false; clearReply();
        document.getElementById("messages").innerHTML = "";
        loadChain();

        document.getElementById("joinScreen").style.display = "none";
        document.getElementById("app").classList.add("active");
        document.getElementById("roomTitle").textContent = `#${myRoom}`;
        document.getElementById("e2eeBadge").textContent = myPass ? "🔒 E2EE" : "🔓 Public";
        renderPeers();

        for (const b of chain.slice(-25)) {
          const res = await decryptPayload(b.ciphertext, topics.msg);
          if (res.ok) appendMessage({ id: b.id, sender: b.sender, text: res.text, time: b.time, own: b.sender === myNick, synced: true });
        }
        connectMqtt();
      } finally { btn.disabled = false; btn.textContent = "Join Room"; }
    }

    function leaveToSetup() {
      if (client) {
        try { client.publish(topics.presence, JSON.stringify({ sender: myNick, type: "leave", status: myStatus }), { qos: 1 }); } catch {}
        client.end(true); client = null;
      }
      toggleDrawer(false);
      document.getElementById("app").classList.remove("active");
      document.getElementById("joinScreen").style.display = "flex";
      renderRecentRooms();
    }

    function connectMqtt() {
      if (client) client.end(true);
      const willPayload = JSON.stringify({ sender: myNick, type: "leave", status: myStatus });
      client = mqtt.connect(BROKER_WSS, {
        clientId: `bstkweb_${Math.random().toString(16).slice(2, 10)}`,
        clean: true, reconnectPeriod: 3000,
        will: { topic: topics.presence, payload: willPayload, qos: 1, retain: false },
      });
      client.on("connect", () => {
        setConn(true);
        client.subscribe([topics.msg, topics.presence, topics.sync], () => {
          publishPresence("join");
          setTimeout(requestSync, 500);
        });
      });
      client.on("reconnect", () => setConn(false));
      client.on("close", () => setConn(false));
      client.on("message", async (topic, payloadBuf) => {
        let p; try { p = JSON.parse(dec.decode(payloadBuf)); } catch { return; }
        if (!p || typeof p !== "object" || p.sender === myNick) return;
        if (topic === topics.presence) handlePresence(p);
        else if (topic === topics.msg) await handleMessage(p);
        else if (topic === topics.sync) await handleSync(p);
      });
    }

    function setConn(ok) {
      document.getElementById("connDot").className = "dot" + (ok ? " ok" : "");
      document.getElementById("connText").textContent = ok ? "Connected" : "Reconnecting";
    }
    function publishPresence(type, extra = {}) {
      if (client && client.connected) client.publish(topics.presence, JSON.stringify({ sender: myNick, type, status: myStatus, ...extra }), { qos: 1 });
    }
    function requestSync() {
      if (client && client.connected) client.publish(topics.sync, JSON.stringify({ sender: myNick, type: "sync_request", known_ids: chain.slice(-500).map((b) => String(b.id)), limit: 100 }), { qos: 1 });
    }
    function sendAck(target_id, status = "delivered") {
      if (client && client.connected && target_id) client.publish(topics.sync, JSON.stringify({ sender: myNick, type: "ack", target_id, status }), { qos: 0 });
    }

    function handlePresence(p) {
      const now = Date.now(), s = String(p.sender || "Peer"), st = String(p.status || "Active");
      if (p.type === "join") {
        const isNew = !peers[s]; peers[s] = { lastSeen: now, status: st };
        if (isNew) { appendSystem(`${s} joined.`); publishPresence("heartbeat"); setTimeout(requestSync, 400); }
      } else if (p.type === "leave") {
        delete typingPeers[s]; if (peers[s]) { delete peers[s]; appendSystem(`${s} left.`); }
      } else if (p.type === "heartbeat") { peers[s] = { lastSeen: now, status: st }; }
      else if (p.type === "typing") { peers[s] = { lastSeen: now, status: st }; typingPeers[s] = now; }
      renderPeers();
    }

    async function handleMessage(p) {
      const sender = String(p.sender || "Anonymous"), timeStr = String(p.time || nowTimeStr());
      delete typingPeers[sender]; renderPeers();
      const res = await decryptPayload(String(p.text || ""), topics.msg);
      if (!res.ok) { appendSystem(`⚠ Undecryptable message from ${sender}`); return; }

      if (p.type === "file") {
        try { const f = JSON.parse(res.text); renderFileBubble({ sender, filename: f.filename, b64: f.data, time: timeStr, own: false }); } catch {}
        return;
      }
      if (p.type === "reaction" && p.target_id) { applyReaction(p.target_id, res.text, sender); return; }
      if (p.type === "edit" && p.target_id) {
        const box = document.getElementById(`msg-${p.target_id}`);
        if (box) { box.querySelector(".msg-body").innerHTML = formatMarkdown(res.text); box.querySelector(".msg-edited").textContent = "(edited)"; }
        return;
      }
      if (p.type === "delete" && p.target_id) {
        const box = document.getElementById(`msg-${p.target_id}`);
        if (box) { box.classList.add("deleted"); box.querySelector(".msg-body").textContent = "This message was deleted"; }
        return;
      }
      if (p.type === "dm") {
        if (p.target === myNick) appendMessage({ id: p.id, sender, text: res.text, time: timeStr, dm: true, own: false });
        return;
      }

      let replyInfo = null;
      if (p.reply_to && typeof p.reply_to === "object") {
        const prev = await decryptPayload(String(p.reply_to.preview || ""), topics.msg);
        replyInfo = { id: p.reply_to.id, sender: p.reply_to.sender, preview: prev.ok ? prev.text : "" };
      }
      const msgId = String(p.id || `${sender}:${timeStr}:${p.text.slice(0, 16)}`);
      const mention = new RegExp(`(?:^|[\\s@])${myNick.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i").test(res.text);
      appendMessage({ id: msgId, sender, text: res.text, time: timeStr, mention, reply_to: replyInfo, own: false });
      await appendChainBlock(msgId, p.ts || Date.now() / 1000, timeStr, sender, "message", String(p.text));
      sendAck(msgId, document.hidden ? "delivered" : "read");
    }

    async function handleSync(p) {
      if (p.type === "ack" && p.target_id) {
        const el = document.getElementById(`ack-${p.target_id}`);
        if (el) el.innerHTML = p.status === "read" ? `<span class="tick read">✓✓</span>` : `<span class="tick">✓✓</span>`;
        return;
      }
      if (p.type === "sync_request") {
        const known = new Set(Array.isArray(p.known_ids) ? p.known_ids.map(String) : []);
        const missing = chain.filter((b) => !known.has(String(b.id))).slice(-100);
        if (missing.length && client && client.connected) client.publish(topics.sync, JSON.stringify({ sender: myNick, type: "sync_response", target: p.sender, blocks: missing }), { qos: 1 });
      } else if (p.type === "sync_response" && p.target === myNick && Array.isArray(p.blocks)) {
        const added = [];
        for (const b of p.blocks) {
          if (!b || !b.id || seenIds.has(String(b.id))) continue;
          if (b.hash !== await computeBlockHash(b)) continue;
          chain.push(b); seenIds.add(String(b.id)); added.push(b);
        }
        if (added.length) {
          chain.sort((a, b) => a.ts - b.ts || String(a.id).localeCompare(String(b.id)));
          saveChain();
          appendSystem(`🔗 Synced ${added.length} message(s) from ${p.sender}`);
          for (const b of added) {
            const res = await decryptPayload(String(b.ciphertext || ""), topics.msg);
            if (res.ok) appendMessage({ id: b.id, sender: b.sender, text: res.text, time: b.time, own: b.sender === myNick, synced: true });
          }
        }
      }
    }

    function applyReaction(targetId, emoji, sender) {
      const byEmoji = reactionsMap[targetId] || (reactionsMap[targetId] = {});
      const list = byEmoji[emoji] || (byEmoji[emoji] = []);
      const idx = list.indexOf(sender);
      if (idx >= 0) { list.splice(idx, 1); if (!list.length) delete byEmoji[emoji]; }
      else list.push(sender);
      const el = document.getElementById(`react-${targetId}`);
      if (el) el.innerHTML = Object.entries(byEmoji).map(([em, users]) => `<span class="react-pill" onclick="reactMsg('${escapeHtml(targetId)}','${escapeHtml(em)}')">${escapeHtml(em)} ${users.length}</span>`).join("");
    }
    async function reactMsg(target_id, emoji) {
      if (!client) return;
      const cipher = await encryptPayload(emoji, topics.msg);
      client.publish(topics.msg, JSON.stringify({ sender: myNick, type: "reaction", target_id, text: cipher, time: nowTimeStr() }), { qos: 1 });
      applyReaction(target_id, emoji, myNick);
    }
    async function editMsg(target_id) {
      const next = prompt("Edit message:");
      if (!next || !next.trim() || !client) return;
      const cipher = await encryptPayload(next.trim(), topics.msg);
      client.publish(topics.msg, JSON.stringify({ sender: myNick, type: "edit", target_id, text: cipher, time: nowTimeStr() }), { qos: 1 });
      const box = document.getElementById(`msg-${target_id}`);
      if (box) { box.querySelector(".msg-body").innerHTML = formatMarkdown(next.trim()); box.querySelector(".msg-edited").textContent = "(edited)"; }
    }
    async function deleteMsg(target_id) {
      if (!client) return;
      const cipher = await encryptPayload("[deleted]", topics.msg);
      client.publish(topics.msg, JSON.stringify({ sender: myNick, type: "delete", target_id, text: cipher, time: nowTimeStr() }), { qos: 1 });
      const box = document.getElementById(`msg-${target_id}`);
      if (box) { box.classList.add("deleted"); box.querySelector(".msg-body").textContent = "This message was deleted"; }
    }

    function setReply(id, sender, text) {
      replyTo = { id, sender, preview: String(text).slice(0, 80) };
      document.getElementById("replyText").textContent = `Replying to ${sender}: ${replyTo.preview}`;
      document.getElementById("replyBar").style.display = "flex";
      document.getElementById("msgInput").focus();
    }
    function clearReply() { replyTo = null; document.getElementById("replyBar").style.display = "none"; }

    async function sendMessage() {
      const box = document.getElementById("msgInput");
      const text = box.value.trim();
      if (!text || !client) return;
      box.value = "";
      const target = document.getElementById("dmTarget").value;
      const r = replyTo; clearReply();
      const timeStr = nowTimeStr(), ts = Date.now() / 1000;
      const id = crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : Math.random().toString(16).slice(2);
      const cipher = await encryptPayload(text, topics.msg);
      const payload = target
        ? { id, ts, sender: myNick, type: "dm", target, text: cipher, time: timeStr }
        : { id, ts, sender: myNick, type: "message", text: cipher, time: timeStr };
      if (r && !target) payload.reply_to = { id: r.id, sender: r.sender, preview: await encryptPayload(r.preview, topics.msg) };
      client.publish(topics.msg, JSON.stringify(payload), { qos: 1 });

      if (target) appendMessage({ id, sender: myNick, text, time: timeStr, dm: true, target, own: true });
      else {
        appendMessage({ id, sender: myNick, text, time: timeStr, reply_to: r, own: true });
        await appendChainBlock(id, ts, timeStr, myNick, "message", cipher);
      }
    }

    function sendRawFile(file) {
      if (!file || !client) return;
      if (file.size > MAX_FILE_BYTES) { alert("Max file size is 512 KB."); return; }
      const reader = new FileReader();
      reader.onload = async () => {
        const b64 = reader.result.split(",")[1];
        const fname = file.name || `clip-${Date.now()}.png`;
        const cipher = await encryptPayload(JSON.stringify({ filename: fname, data: b64 }), topics.msg);
        const timeStr = nowTimeStr();
        client.publish(topics.msg, JSON.stringify({ sender: myNick, type: "file", text: cipher, time: timeStr }), { qos: 1 });
        renderFileBubble({ sender: myNick, filename: fname, b64, time: timeStr, own: true });
      };
      reader.readAsDataURL(file);
    }
    function sendFile(input) { sendRawFile(input.files[0]); input.value = ""; }

    async function toggleVoice() {
      const btn = document.getElementById("voiceBtn");
      if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); btn.textContent = "🎤 Voice"; return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceChunks = []; mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size) voiceChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(voiceChunks, { type: "audio/webm" });
          sendRawFile(new File([blob], `voice-${Date.now()}.webm`, { type: "audio/webm" }));
        };
        mediaRecorder.start(); btn.textContent = "⏹ Stop";
      } catch { alert("Microphone permission required for voice notes."); }
    }

    function renderFileBubble({ sender, filename, b64, time, own }) {
      const msgEl = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg" + (own ? " own" : "");
      const safeName = escapeHtml(filename);
      const isImg = /\.(png|jpe?g|gif|webp)$/i.test(filename);
      const isAudio = /\.(webm|ogg|mp3|wav|m4a)$/i.test(filename);
      const mime = isImg ? "image/" + filename.split(".").pop().toLowerCase().replace("jpg", "jpeg") : (isAudio ? "audio/webm" : "application/octet-stream");
      const dataUrl = `data:${mime};base64,${b64}`;
      let body = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>📄 <strong>${safeName}</strong></span><a class="btn-ghost" style="text-decoration:none;" href="${dataUrl}" download="${safeName}">⬇ Download</a></div>`;
      if (isImg) body = `<img class="chat-img" src="${dataUrl}" alt="${safeName}" onclick="openLightbox('${dataUrl}')" /><a class="btn-ghost" style="text-decoration:none;display:inline-block;" href="${dataUrl}" download="${safeName}">⬇ Download</a>`;
      else if (isAudio) body = `<audio controls src="${dataUrl}" style="max-width:240px;"></audio>`;
      div.innerHTML = `<div class="msg-head"><span class="msg-sender">${escapeHtml(own ? sender + " (You)" : sender)}</span></div>${body}<div class="msg-foot"><span>${escapeHtml(time)}</span></div>`;
      msgEl.appendChild(div); scrollToBottom();
    }

    function openLightbox(src) { document.getElementById("lightboxImg").src = src; document.getElementById("lightbox").style.display = "flex"; }
    function scrollToBottom() { const el = document.getElementById("messages"); el.scrollTop = el.scrollHeight; document.getElementById("scrollBtn").style.display = "none"; }
    document.getElementById("messages").addEventListener("scroll", (e) => {
      const el = e.target;
      document.getElementById("scrollBtn").style.display = (el.scrollHeight - el.scrollTop - el.clientHeight < 90) ? "none" : "block";
    });

    function appendMessage({ id, sender, text, time, own, dm, target, mention, synced, reply_to }) {
      const msgEl = document.getElementById("messages");
      if (!dateShown) { dateShown = true; const d = document.createElement("div"); d.className = "date-divider"; d.textContent = "Today"; msgEl.appendChild(d); }
      if (id && document.getElementById(`msg-${id}`)) return;
      const div = document.createElement("div");
      if (id) div.id = `msg-${id}`;
      const cls = ["msg"];
      if (own) cls.push("own"); if (dm) cls.push("dm"); if (mention) cls.push("mention");
      div.className = cls.join(" ");
      div.onclick = (e) => { if (!e.target.closest("button,a")) div.classList.toggle("show-actions"); };
      const badge = dm ? `<span class="pill">🔒 DM ${own ? "to " + escapeHtml(target) : ""}</span>` : synced ? `<span class="pill">🔗 Synced</span>` : "";
      const quote = reply_to ? `<div class="reply-quote"><strong>${escapeHtml(reply_to.sender)}</strong>: ${escapeHtml(reply_to.preview)}</div>` : "";
      const emBtns = QUICK_EMOJIS.map((em) => `<button class="msg-act-btn" onclick="reactMsg('${escapeHtml(id)}','${em}')">${em}</button>`).join("");
      const ownBtns = own && id ? `<button class="msg-act-btn" onclick="editMsg('${escapeHtml(id)}')">✏️</button><button class="msg-act-btn" onclick="deleteMsg('${escapeHtml(id)}')">🗑️</button>` : "";
      const actions = id ? `<div class="msg-actions">${emBtns}<button class="msg-act-btn" onclick="setReply('${escapeHtml(id)}','${escapeHtml(sender)}','${escapeHtml(text).replace(/'/g,'')}')">↩</button>${ownBtns}</div>` : "";
      const tick = own && id ? `<span id="ack-${escapeHtml(id)}"><span class="tick">✓</span></span>` : "";
      div.innerHTML = `${quote}<div class="msg-head"><span class="msg-sender">${escapeHtml(own ? sender + " (You)" : sender)}</span>${badge}</div><div class="msg-body">${formatMarkdown(text)}</div><div class="reactions-row" id="react-${escapeHtml(id)}"></div><div class="msg-foot"><span class="msg-edited"></span><span>${escapeHtml(time || "")}</span>${tick}</div>${actions}`;
      msgEl.appendChild(div); scrollToBottom();
      if (!own && document.hidden && Notification.permission === "granted") new Notification(`BSTK Chat • ${sender}`, { body: text.slice(0, 100) });
    }
    function appendSystem(text) {
      const msgEl = document.getElementById("messages");
      const div = document.createElement("div"); div.className = "msg system"; div.textContent = text;
      msgEl.appendChild(div); scrollToBottom();
    }

    function renderPeers() {
      const now = Date.now(), list = document.getElementById("peerList"), dm = document.getElementById("dmTarget"), prev = dm.value;
      const names = Object.keys(peers).sort((a, b) => a.localeCompare(b));
      document.getElementById("peerCount").textContent = String(names.length + 1);
      list.innerHTML = `<div class="peer-item"><span><strong>${escapeHtml(myNick)}</strong> (You)</span><span style="color:var(--muted);font-size:0.74rem;">${escapeHtml(myStatus)}</span></div>`;
      dm.innerHTML = `<option value="">Everyone</option>`;
      for (const n of names) {
        const el = document.createElement("div"); el.className = "peer-item";
        el.onclick = () => { dm.value = n; toggleDrawer(false); document.getElementById("msgInput").focus(); };
        el.innerHTML = `<span>${escapeHtml(n)}</span><span style="color:var(--muted);font-size:0.74rem;">${escapeHtml(peers[n].status)}</span>`;
        list.appendChild(el);
        const opt = document.createElement("option"); opt.value = n; opt.textContent = `DM → ${n}`; dm.appendChild(opt);
      }
      dm.value = prev;
      const typers = Object.keys(typingPeers).filter((n) => now - typingPeers[n] < 5000);
      document.getElementById("typingBar").textContent = typers.length ? `✎ ${typers.join(", ")} typing...` : "";
    }
    function copyInviteLink() {
      const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(myRoom)}`;
      navigator.clipboard?.writeText(link); appendSystem("Copied invite link: " + link); toggleDrawer(false);
    }

    document.getElementById("msgInput").addEventListener("paste", (e) => {
      for (const item of (e.clipboardData?.items || [])) {
        if (item.kind === "file") { e.preventDefault(); sendRawFile(item.getAsFile()); return; }
      }
    });
    document.getElementById("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      else if (Date.now() - lastTypingSent > 3000) { lastTypingSent = Date.now(); publishPresence("typing"); }
    });
    setInterval(() => {
      if (!client) return;
      publishPresence("heartbeat");
      const now = Date.now();
      for (const n of Object.keys(peers)) { if (now - peers[n].lastSeen > 45000) { delete peers[n]; appendSystem(`${n} timed out.`); } }
      renderPeers();
    }, 15000);

    renderRecentRooms();
  </script>
</body>
</html>
